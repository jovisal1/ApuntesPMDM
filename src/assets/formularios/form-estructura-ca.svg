<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="835" viewBox="0 0 1100 835" role="img" aria-labelledby="title desc">
<title id="title">Les peces d’un formulari Flutter</title>
<desc id="desc">Una GlobalKey permet accedir a FormState. Form conté els camps, i FormState coordina la validació, el guardat i el reinici.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#42648d" stroke-width="2"/></marker></defs>
<rect width="1100" height="835" rx="20" fill="#f1f5fb"/>
<g font-family="Arial, sans-serif" fill="#172c47">
<text x="28" y="37" font-size="23" font-weight="700">View: ControlesEntradaPantalla</text>
<rect x="28" y="64" width="480" height="450" rx="16" fill="white" stroke="#9bb5d9" stroke-width="2"/>
<text x="50" y="99" font-size="20" font-weight="700">Estructura de widgets</text>
<rect x="50" y="119" width="436" height="48" rx="8" fill="#245cca"/>
<text x="70" y="150" font-size="20" font-weight="700" fill="white">Form</text>
<path d="M70 167v24h20" fill="none" stroke="#7e96b4" stroke-width="2"/>
<rect x="90" y="182" width="376" height="42" rx="7" fill="#edf3ff"/>
<text x="108" y="209" font-size="17">Column</text>
<path d="M108 224v207M108 263h24M108 326h24M108 389h24" fill="none" stroke="#7e96b4" stroke-width="2"/>
<rect x="132" y="242" width="334" height="42" rx="7" fill="#e4f3eb"/>
<text x="148" y="269" font-size="17">TextFormField</text>
<rect x="132" y="305" width="334" height="42" rx="7" fill="#e4f3eb"/>
<text x="148" y="332" font-size="17">DropdownButtonFormField</text>
<rect x="132" y="368" width="334" height="42" rx="7" fill="#e4f3eb"/>
<text x="148" y="395" font-size="17">FormField&lt;bool&gt;</text>
<path d="M151 410v24h20" fill="none" stroke="#7e96b4" stroke-width="2"/>
<rect x="171" y="424" width="295" height="39" rx="7" fill="#f4f7fa" stroke="#b6c4d5"/>
<text x="186" y="449" font-size="17">CheckboxListTile</text>
<text x="50" y="490" font-size="14" fill="#52667f">Els camps apareixen en verd.</text>
<rect x="635" y="64" width="437" height="94" rx="12" fill="white" stroke="#9bb5d9" stroke-width="2"/>
<text x="657" y="97" font-size="19" font-weight="700">GlobalKey&lt;FormState&gt;</text>
<text x="657" y="127" font-family="monospace" font-size="17">_formKey</text>
<path d="M508 143h109" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="123" font-size="12" text-anchor="middle">key: _formKey</text>
<path d="M854 158v67" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="191" font-family="monospace" font-size="14">currentState</text>
<rect x="635" y="235" width="437" height="279" rx="16" fill="white" stroke="#9bb5d9" stroke-width="2"/>
<text x="657" y="273" font-size="22" font-weight="700">FormState</text>
<text x="657" y="302" font-size="16">L’estat que coordina els camps</text>
<rect x="657" y="324" width="393" height="48" rx="7" fill="#edf3ff"/>
<text x="673" y="354" font-size="16">validate() → consulta els validator</text>
<rect x="657" y="384" width="393" height="48" rx="7" fill="#edf3ff"/>
<text x="673" y="414" font-size="16">save() → executa els onSaved</text>
<rect x="657" y="444" width="393" height="48" rx="7" fill="#edf3ff"/>
<text x="673" y="474" font-size="16">reset() → restablix els camps</text>
<text x="28" y="814" font-size="16">Form agrupa els camps; la clau permet accedir al seu FormState per a actuar sobre ells.</text>
<path d="M854 514v76" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="556" font-size="14">save() → guardarDatos()</text>
<path d="M176 603v-76" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="193" y="569" font-size="14">SnackBar</text>
<rect x="28" y="604" width="1044" height="176" rx="16" fill="#e4f3eb" stroke="#82ac98" stroke-width="2"/>
<text x="50" y="637" font-size="22" font-weight="700">ViewModel: ElementosFormularioViewModel</text>
<text x="50" y="665" font-size="17">Dades i regles de la demostració</text>
<text x="50" y="696" font-family="monospace" font-size="16">validarNombre() · validarTurno() · validarCondiciones()</text>
<text x="50" y="726" font-family="monospace" font-size="16">guardarDatos(borrador) → còpia privada en _datos</text>
<text x="50" y="756" font-family="monospace" font-size="16">La View llig datos → mostra un SnackBar</text></g></svg>