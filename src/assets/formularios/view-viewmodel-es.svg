<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">El formulario: View y ViewModel</title><desc id="desc">1. Escribes en Nombre → la View llama a cambiarNombre(texto). 2. El ViewModel actualiza el dato y llama a notifyListeners(). 3. ListenableBuilder reconstruye la View con los datos actuales.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#245cca" stroke-width="2"/></marker></defs>
<rect width="1100" height="600" rx="20" fill="#f1f5fb"/>
<g font-family="Arial, sans-serif" fill="#172c47">
<text x="24" y="35" font-size="23" font-weight="700">El formulario: View y ViewModel</text>
<rect x="24" y="57" width="430" height="371" rx="16" fill="white" stroke="#9bb5d9" stroke-width="2"/>
<rect x="646" y="57" width="430" height="371" rx="16" fill="white" stroke="#9bb5d9" stroke-width="2"/>
<text x="46" y="93" font-size="24" font-weight="700">View</text><text x="46" y="121" font-size="16">La pantalla que usa el alumno</text>
<text x="46" y="146" font-size="14" fill="#52667f">InscripcionPantalla</text>
<text x="46" y="179" font-size="13">Nombre</text><rect x="46" y="189" width="386" height="39" rx="6" fill="#f8fafc" stroke="#8295ae"/><text x="58" y="215" font-size="16">Ana</text>
<text x="46" y="250" font-size="13">Correo</text><rect x="46" y="260" width="386" height="39" rx="6" fill="#f8fafc" stroke="#8295ae"/><text x="58" y="286" font-size="16">ana@centro.es</text>
<rect x="46" y="315" width="386" height="39" rx="19" fill="#245cca"/><text x="239" y="341" font-size="16" fill="white" text-anchor="middle">Previsualizar</text>
<text x="46" y="382" font-size="16">Campos, errores, teclado y controladores</text><text x="46" y="407" font-size="16">Muestra el resumen cuando existe</text>
<text x="668" y="93" font-size="24" font-weight="700">ViewModel</text><text x="668" y="121" font-size="16">Los datos y las reglas del formulario</text><text x="668" y="146" font-size="14" fill="#52667f">InscripcionViewModel</text>
<text x="668" y="187" font-size="16">Conserva nombre, correo y resumen</text>
