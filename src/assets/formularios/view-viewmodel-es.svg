<text x="682" y="224" font-family="monospace" font-size="15">nombre: 'Ana'</text><text x="682" y="248" font-family="monospace" font-size="15">correo: 'ana@centro.es'</text><text x="682" y="272" font-family="monospace" font-size="15">resumen: null / String</text>
<text x="668" y="315" font-size="16">Comprueba el nombre y el correo</text><text x="668" y="341" font-family="monospace" font-size="14">validarNombre() · validarCorreo()</text>
<text x="668" y="380" font-size="16">Genera el resumen si los datos son válidos</text><text x="668" y="406" font-family="monospace" font-size="15">previsualizar()</text>
<text x="550" y="207" font-size="15" text-anchor="middle">Texto y acciones</text><path d="M466 224H632" stroke="#245cca" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550" y="310" font-size="15" text-anchor="middle">Aviso de cambio</text><path d="M634 328H468" stroke="#245cca" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550" y="356" font-family="monospace" font-size="12" text-anchor="middle">notifyListeners()</text>
<text x="26" y="479" font-size="19">1. Escribes en Nombre → la View llama a cambiarNombre(texto).</text><text x="26" y="521" font-size="19">2. El ViewModel actualiza el dato y llama a notifyListeners().</text><text x="26" y="563" font-size="19">3. ListenableBuilder reconstruye la View con los datos actuales.</text>
