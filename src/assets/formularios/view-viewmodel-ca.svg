<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">El formulari: View i ViewModel</title><desc id="desc">1. Escrius en Nombre → la View crida cambiarNombre(texto). 2. El ViewModel actualitza la dada i crida notifyListeners(). 3. ListenableBuilder reconstruïx la View amb les dades actuals.</desc>
