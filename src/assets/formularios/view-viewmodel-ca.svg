<text x="26" y="479" font-size="19">1. Escrius en Nombre → la View crida cambiarNombre(texto).</text><text x="26" y="521" font-size="19">2. El ViewModel actualitza la dada i crida notifyListeners().</text><text x="26" y="563" font-size="19">3. ListenableBuilder reconstruïx la View amb les dades actuals.</text>
