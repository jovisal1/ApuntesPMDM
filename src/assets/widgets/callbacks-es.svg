<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title"><title id="title">Datos bajan, eventos suben</title><rect width="900" height="350" rx="24" fill="#101c35"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#67e8f9"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="450" y="46" font-size="25" font-weight="bold" fill="#fff">Datos bajan, eventos suben</text><rect x="30" y="90" width="180" height="94" rx="16" fill="#243c61" stroke="#67e8f9"/><text x="120" y="145" font-size="18" fill="#fff">State → build()</text><path d="M214,137 H244" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="250" y="90" width="180" height="94" rx="16" fill="#243c61" stroke="#67e8f9"/><text x="340" y="145" font-size="18" fill="#fff">Hijo / Fill</text><path d="M434,137 H464" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="90" width="180" height="94" rx="16" fill="#243c61" stroke="#67e8f9"/><text x="560" y="145" font-size="18" fill="#fff">onPressed</text><path d="M654,137 H684" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="90" width="180" height="94" rx="16" fill="#243c61" stroke="#67e8f9"/><text x="780" y="145" font-size="18" fill="#fff">callback → State</text><text x="450" y="228" font-size="18" fill="#dbeafe">El padre envía datos y una función por el constructor.</text><text x="450" y="260" font-size="18" fill="#dbeafe">El hijo invoca la función; el padre actualiza con setState().</text><text x="450" y="292" font-size="18" fill="#dbeafe">La nueva descripción refleja el estado actualizado.</text></g></svg>