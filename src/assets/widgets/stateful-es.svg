<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title"><title id="title">Dos clases, un widget con estado</title><rect width="920" height="470" rx="24" fill="#101c35"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#67e8f9"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="460" y="43" fill="white" font-size="25" font-weight="bold">Dos clases, un widget con estado</text><rect x="35" y="80" width="365" height="132" rx="16" fill="#243c61" stroke="#67e8f9"/><text x="217" y="117" fill="white" font-size="21" font-weight="bold">Contador: configuración</text><text x="217" y="149" fill="#dbeafe" font-size="18">StatefulWidget</text><text x="217" y="182" fill="#dbeafe" font-size="17">constructor + createState()</text><rect x="520" y="80" width="365" height="132" rx="16" fill="#243c61" stroke="#67e8f9"/><text x="702" y="117" fill="white" font-size="21" font-weight="bold">_ContadorState: memoria</text><text x="702" y="149" fill="#dbeafe" font-size="18">State&lt;Contador&gt;</text><text x="702" y="182" fill="#dbeafe" font-size="17">_pulsaciones + build()</text><path d="M405 149 H515" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><text x="460" y="132" font-size="15" fill="#dbeafe">crea</text><text x="460" y="258" fill="white" font-size="21">Qué ocurre al interactuar</text><rect x="25" y="290" width="195" height="70" rx="14" fill="#14505a" stroke="#67e8f9"/><text x="122" y="332" fill="white" font-size="18">Pulsar el botón</text><path d="M225 325 H245" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="250" y="290" width="195" height="70" rx="14" fill="#14505a" stroke="#67e8f9"/><text x="347" y="332" fill="white" font-size="18">setState: 0 → 1</text><path d="M450 325 H470" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="475" y="290" width="195" height="70" rx="14" fill="#14505a" stroke="#67e8f9"/><text x="572" y="332" fill="white" font-size="18">build() de nuevo</text><path d="M675 325 H695" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="700" y="290" width="195" height="70" rx="14" fill="#14505a" stroke="#67e8f9"/><text x="797" y="332" fill="white" font-size="18">Pulsaciones: 1</text><text x="460" y="410" fill="#dbeafe" font-size="19">Se conserva el mismo State: el número no vuelve a cero.</text></g></svg>