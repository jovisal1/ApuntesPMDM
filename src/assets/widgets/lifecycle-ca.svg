<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="title"><title id="title">El cicle de vida de State</title><rect width="920" height="700" rx="24" fill="#101c35"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#67e8f9"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><text x="460" y="44" font-size="25" font-weight="bold" fill="white">El cicle de vida de State</text><rect x="320" y="75" width="280" height="76" rx="14" fill="#243c61" stroke="#67e8f9"/><text x="460.0" y="106" font-size="19" font-weight="bold" fill="white">createState()</text><text x="460.0" y="132" font-size="15" fill="#dbeafe">crear l’estat</text><rect x="320" y="181" width="280" height="76" rx="14" fill="#243c61" stroke="#67e8f9"/><text x="460.0" y="212" font-size="19" font-weight="bold" fill="white">initState()</text><text x="460.0" y="238" font-size="15" fill="#dbeafe">una vegada per State</text><rect x="320" y="287" width="280" height="76" rx="14" fill="#243c61" stroke="#67e8f9"/><text x="460.0" y="318" font-size="19" font-weight="bold" fill="white">didChangeDependencies()</text><text x="460.0" y="344" font-size="15" fill="#dbeafe">a l’inici i si canvia una dependència</text><rect x="320" y="393" width="280" height="76" rx="14" fill="#14505a" stroke="#67e8f9"/><text x="460.0" y="424" font-size="19" font-weight="bold" fill="white">build()</text><text x="460.0" y="450" font-size="15" fill="#dbeafe">descriu la interfície</text><rect x="30" y="393" width="220" height="76" rx="14" fill="#243c61" stroke="#67e8f9"/><text x="140.0" y="424" font-size="19" font-weight="bold" fill="white">didUpdateWidget()</text><text x="140.0" y="450" font-size="15" fill="#dbeafe">configuració nova</text><rect x="670" y="393" width="220" height="76" rx="14" fill="#243c61" stroke="#67e8f9"/><text x="780.0" y="424" font-size="19" font-weight="bold" fill="white">setState()</text><text x="780.0" y="450" font-size="15" fill="#dbeafe">canvia l’estat</text><rect x="320" y="499" width="280" height="76" rx="14" fill="#243c61" stroke="#67e8f9"/><text x="460.0" y="530" font-size="19" font-weight="bold" fill="white">deactivate()</text><text x="460.0" y="556" font-size="15" fill="#dbeafe">ix de l’arbre</text><rect x="320" y="605" width="280" height="76" rx="14" fill="#57304a" stroke="#67e8f9"/><text x="460.0" y="636" font-size="19" font-weight="bold" fill="white">dispose()</text><text x="460.0" y="662" font-size="15" fill="#dbeafe">alliberament definitiu</text><path d="M460 151 V175" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M460 257 V281" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M460 363 V387" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M460 469 V493" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M460 575 V599" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M250 431 H315" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M670 431 H605" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 325 H635 V380 H570 V388" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320 537 H280 V480 H330 V474" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/><text x="153" y="509" fill="#dbeafe" font-size="15">Si es reinserix:</text><text x="153" y="532" fill="#dbeafe" font-size="15">activate() → build()</text><text x="751" y="548" fill="#dbeafe" font-size="15">Si la retirada és definitiva</text></g></svg>