<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc"><title id="title">Espai exterior: margin / Espai interior: padding</title><desc id="desc">El marge queda fora de la caixa; el padding, entre la vora i el contingut.</desc><rect width="920" height="380" rx="20" fill="#f1f5f9"/><g font-family="sans-serif" fill="#0f172a"><text x="28" y="40" font-size="23" font-weight="700">Espai exterior: margin</text><rect x="90" y="66" width="740" height="276" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="112" y="100" font-size="19" font-weight="700">Caixa del component</text><rect x="155" y="124" width="610" height="184" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-dasharray="6 5"/><text x="175" y="156" font-size="19">Espai interior: padding</text><rect x="250" y="184" width="420" height="82" rx="8" fill="white" stroke="#94a3b8"/><text x="460" y="234" font-size="22" text-anchor="middle">Contingut</text></g></svg>