<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc"><title id="title">Biblioteca d’objectes del barri</title><desc id="desc">1 · Consultar i filtrar. 2 · Llegir la fitxa. Torna a la llista amb el filtre conservat.</desc><rect x="0" y="0" width="1040" height="800" rx="20" fill="#f1f5f9" stroke="none"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="27" fill="#0f172a" font-weight="700">Biblioteca d’objectes del barri</text><text x="40" y="78" font-size="16" fill="#334155" font-weight="400">Esbós orientatiu · Dades fictícies i locals</text><text x="40" y="122" font-size="20" fill="#0f172a" font-weight="700">1 · Consultar i filtrar</text><rect x="40" y="142" width="410" height="570" rx="18" fill="white" stroke="#94a3b8"/><text x="590" y="122" font-size="20" fill="#0f172a" font-weight="700">2 · Llegir la fitxa</text><rect x="590" y="142" width="410" height="570" rx="18" fill="white" stroke="#94a3b8"/><rect x="40" y="142" width="410" height="62" rx="18" fill="#0f766e" stroke="none"/><text x="60" y="181" font-size="19" fill="white" font-weight="700">←    Exemple amb dades</text><text x="62" y="238" font-size="16" fill="#334155" font-weight="400">Mostrant 4 de 4 articles</text><rect x="62" y="254" width="180" height="36" rx="18" fill="#0f766e" stroke="none"/><text x="78" y="278" font-size="15" fill="white" font-weight="700">Només disponibles</text><rect x="62" y="308" width="366" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="335" font-size="20" fill="#0f172a" font-weight="700">Trepant percussor</text><text x="80" y="359" font-size="15" fill="#334155" font-weight="400">Bricolatge · Disponible</text><text x="80" y="382" font-size="15" fill="#334155" font-weight="400">Amb maletí i joc de broques</text><rect x="80" y="392" width="130" height="28" rx="14" fill="white" stroke="#0f766e"/><text x="94" y="412" font-size="14" fill="#0f766e" font-weight="700">Veure detall</text><rect x="62" y="445" width="366" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="472" font-size="20" fill="#0f172a" font-weight="700">Màquina de cosir</text><text x="80" y="496" font-size="15" fill="#334155" font-weight="400">Llar · Prestada</text><text x="80" y="519" font-size="15" fill="#334155" font-weight="400">Per a retocs de roba</text><rect x="80" y="529" width="130" height="28" rx="14" fill="white" stroke="#0f766e"/><text x="94" y="549" font-size="14" fill="#0f766e" font-weight="700">Veure detall</text><rect x="62" y="582" width="366" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="609" font-size="20" fill="#0f172a" font-weight="700">Projector</text><text x="80" y="633" font-size="15" fill="#334155" font-weight="400">Oci · Disponible</text><text x="80" y="656" font-size="15" fill="#334155" font-weight="400">Amb connexió HDMI</text><rect x="80" y="666" width="130" height="28" rx="14" fill="white" stroke="#0f766e"/><text x="94" y="686" font-size="14" fill="#0f766e" font-weight="700">Veure detall</text><path d="M460 405 H570 m-10 -8 10 8 -10 8" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="590" y="142" width="410" height="62" rx="18" fill="#0f766e" stroke="none"/><text x="610" y="181" font-size="19" fill="white" font-weight="700">←    Fitxa de l’article</text><text x="614" y="241" font-size="24" fill="#0f172a" font-weight="700">Trepant percussor</text><text x="614" y="270" font-size="16" fill="#334155" font-weight="400">Bricolatge · Disponible</text><path d="M614 290 H976 M614 440 H976" stroke="#cbd5e1"/><text x="614" y="324" font-size="20" fill="#0f172a" font-weight="700">Condicions del préstec</text><text x="614" y="357" font-size="17" fill="#334155" font-weight="400">Termini màxim: 3 dies</text><text x="614" y="392" font-size="16" fill="#334155" font-weight="400">Usa ulleres de protecció.</text><text x="614" y="417" font-size="16" fill="#334155" font-weight="400">Torna les broques en l’estoig.</text><text x="614" y="477" font-size="20" fill="#0f172a" font-weight="700">Punt d’arreplega</text><text x="614" y="515" font-size="17" fill="#0f172a" font-weight="700">Centre veïnal La Plaça</text><text x="614" y="543" font-size="16" fill="#334155" font-weight="400">Carrer Major, 12</text><text x="614" y="571" font-size="16" fill="#334155" font-weight="400">De dilluns a divendres, 17–20 h</text><text x="614" y="627" font-size="17" fill="#0f172a" font-weight="700">Consulta informativa</text><text x="614" y="655" font-size="16" fill="#334155" font-weight="400">Demana el préstec al centre.</text><text x="590" y="751" font-size="16" fill="#0f766e" font-weight="400">Torna a la llista amb el filtre conservat.</text></g></svg>