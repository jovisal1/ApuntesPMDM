<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">De la fuente a los modelos de la aplicación</title><desc id="desc">El servicio devuelve ArticuloDto. El repositorio convierte DISP y 72 horas en disponible y 3 días, y entrega Articulo a la interfaz.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#0f766e"/></marker></defs><rect width="1080" height="620" rx="20" fill="#f1f5f9"/><g font-family="DejaVu Sans, sans-serif" fill="#0f172a"><text x="36" y="49" font-size="28" font-weight="700" fill="#0f172a">De la fuente a los modelos de la aplicación</text><text x="36" y="80" font-size="17" font-weight="400" fill="#475569">Recorrido de los datos · Fuente local simulada</text><rect x="36" y="122" width="312" height="142" rx="14" fill="white" stroke="#94a3b8"/><text x="54" y="155" font-size="22" font-weight="700" fill="#0f172a">Servicio local</text><text x="54" y="190" font-size="18" font-weight="400" fill="#0f172a">ArticulosLocalService</text><text x="54" y="229" font-size="17" font-weight="400" fill="#475569">Construye los DTO</text><path d="M349 193 H379" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="384" y="122" width="312" height="142" rx="14" fill="white" stroke="#94a3b8"/><text x="402" y="155" font-size="22" font-weight="700" fill="#0f172a">Repositorio</text><text x="402" y="190" font-size="18" font-weight="400" fill="#0f172a">ArticulosRepository</text><text x="402" y="229" font-size="17" font-weight="400" fill="#475569">Valida y transforma</text><path d="M697 193 H727" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="732" y="122" width="312" height="142" rx="14" fill="white" stroke="#94a3b8"/><text x="750" y="155" font-size="22" font-weight="700" fill="#0f172a">Interfaz</text><text x="750" y="190" font-size="18" font-weight="400" fill="#0f172a">ViewModel + vistas</text><text x="750" y="229" font-size="17" font-weight="400" fill="#475569">Filtra y muestra</text><rect x="36" y="307" width="312" height="171" rx="14" fill="#ecfdf5" stroke="#0f766e"/><text x="54" y="339" font-size="22" font-weight="700" fill="#0f172a">ArticuloDto</text><text x="54" y="368" font-size="16" font-weight="400" fill="#475569">data/models</text><text x="54" y="409" font-size="18" font-weight="400" fill="#0f172a">codigoEstado: &quot;DISP&quot;</text><text x="54" y="441" font-size="18" font-weight="400" fill="#0f172a">horasPrestamo: 72</text><rect x="732" y="307" width="312" height="171" rx="14" fill="#ecfdf5" stroke="#0f766e"/><text x="750" y="339" font-size="22" font-weight="700" fill="#0f172a">Articulo</text><text x="750" y="368" font-size="16" font-weight="400" fill="#475569">domain/models</text><text x="750" y="409" font-size="18" font-weight="400" fill="#0f172a">estado: disponible</text><text x="750" y="441" font-size="18" font-weight="400" fill="#0f172a">diasPrestamo: 3</text><text x="405" y="339" font-size="19" font-weight="700" fill="#0f766e">DISP → disponible</text><text x="405" y="374" font-size="19" font-weight="700" fill="#0f766e">72 h ÷ 24 = 3 días</text><text x="405" y="423" font-size="17" font-weight="400" fill="#0f172a">Rechaza datos inválidos</text><text x="405" y="450" font-size="17" font-weight="400" fill="#0f172a">Conserva la colección</text><path d="M350 392 H389 M672 392 H725" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="515" width="1008" height="69" rx="12" fill="#e2e8f0"/><text x="54" y="544" font-size="18" font-weight="700" fill="#0f172a">Los DTO se quedan en data.</text><text x="54" y="571" font-size="17" font-weight="400" fill="#0f172a">El ViewModel y las vistas trabajan con Articulo, Categoria y PuntoRecogida.</text></g></svg>