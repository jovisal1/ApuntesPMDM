<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc"><title id="title">Biblioteca de objetos del barrio</title><desc id="desc">1 · Consultar y filtrar. 2 · Leer la ficha. Vuelve a la lista con el filtro conservado.</desc><rect x="0" y="0" width="1040" height="800" rx="20" fill="#f1f5f9" stroke="none"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="27" fill="#0f172a" font-weight="700">Biblioteca de objetos del barrio</text><text x="40" y="78" font-size="16" fill="#334155" font-weight="400">Boceto orientativo · Datos ficticios y locales</text><text x="40" y="122" font-size="20" fill="#0f172a" font-weight="700">1 · Consultar y filtrar</text><rect x="40" y="142" width="410" height="570" rx="18" fill="white" stroke="#94a3b8"/><text x="590" y="122" font-size="20" fill="#0f172a" font-weight="700">2 · Leer la ficha</text><rect x="590" y="142" width="410" height="570" rx="18" fill="white" stroke="#94a3b8"/><rect x="40" y="142" width="410" height="62" rx="18" fill="#0f766e" stroke="none"/><text x="60" y="181" font-size="19" fill="white" font-weight="700">←    Ejemplo con datos</text><text x="62" y="238" font-size="16" fill="#334155" font-weight="400">Mostrando 4 de 4 artículos</text><rect x="62" y="254" width="180" height="36" rx="18" fill="#0f766e" stroke="none"/><text x="78" y="278" font-size="15" fill="white" font-weight="700">Solo disponibles</text><rect x="62" y="308" width="366" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="335" font-size="20" fill="#0f172a" font-weight="700">Taladro percutor</text><text x="80" y="359" font-size="15" fill="#334155" font-weight="400">Bricolaje · Disponible</text><text x="80" y="382" font-size="15" fill="#334155" font-weight="400">Con maletín y juego de brocas</text><rect x="80" y="392" width="130" height="28" rx="14" fill="white" stroke="#0f766e"/><text x="94" y="412" font-size="14" fill="#0f766e" font-weight="700">Ver detalle</text><rect x="62" y="445" width="366" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="472" font-size="20" fill="#0f172a" font-weight="700">Máquina de coser</text><text x="80" y="496" font-size="15" fill="#334155" font-weight="400">Hogar · Prestada</text><text x="80" y="519" font-size="15" fill="#334155" font-weight="400">Para arreglos de ropa</text><rect x="80" y="529" width="130" height="28" rx="14" fill="white" stroke="#0f766e"/><text x="94" y="549" font-size="14" fill="#0f766e" font-weight="700">Ver detalle</text><rect x="62" y="582" width="366" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="80" y="609" font-size="20" fill="#0f172a" font-weight="700">Proyector</text><text x="80" y="633" font-size="15" fill="#334155" font-weight="400">Ocio · Disponible</text><text x="80" y="656" font-size="15" fill="#334155" font-weight="400">Con conexión HDMI</text><rect x="80" y="666" width="130" height="28" rx="14" fill="white" stroke="#0f766e"/><text x="94" y="686" font-size="14" fill="#0f766e" font-weight="700">Ver detalle</text><path d="M460 405 H570 m-10 -8 10 8 -10 8" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="590" y="142" width="410" height="62" rx="18" fill="#0f766e" stroke="none"/><text x="610" y="181" font-size="19" fill="white" font-weight="700">←    Ficha del artículo</text><text x="614" y="241" font-size="24" fill="#0f172a" font-weight="700">Taladro percutor</text><text x="614" y="270" font-size="16" fill="#334155" font-weight="400">Bricolaje · Disponible</text><path d="M614 290 H976 M614 440 H976" stroke="#cbd5e1"/><text x="614" y="324" font-size="20" fill="#0f172a" font-weight="700">Condiciones del préstamo</text><text x="614" y="357" font-size="17" fill="#334155" font-weight="400">Plazo máximo: 3 días</text><text x="614" y="392" font-size="16" fill="#334155" font-weight="400">Usa gafas de protección.</text><text x="614" y="417" font-size="16" fill="#334155" font-weight="400">Devuelve las brocas en su estuche.</text><text x="614" y="477" font-size="20" fill="#0f172a" font-weight="700">Punto de recogida</text><text x="614" y="515" font-size="17" fill="#0f172a" font-weight="700">Centro vecinal La Plaza</text><text x="614" y="543" font-size="16" fill="#334155" font-weight="400">Calle Mayor, 12</text><text x="614" y="571" font-size="16" fill="#334155" font-weight="400">Lunes a viernes, 17–20 h</text><text x="614" y="627" font-size="17" fill="#0f172a" font-weight="700">Consulta informativa</text><text x="614" y="655" font-size="16" fill="#334155" font-weight="400">Solicita el préstamo en el centro.</text><text x="590" y="751" font-size="16" fill="#0f766e" font-weight="400">Vuelve a la lista con el filtro conservado.</text></g></svg>