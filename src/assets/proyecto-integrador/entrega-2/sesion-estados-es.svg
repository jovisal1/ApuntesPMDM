<svg xmlns="http://www.w3.org/2000/svg" width="800" height="594" viewBox="0 0 800 594" role="img" aria-labelledby="title desc">
<title id="title">¿Qué guarda una sesión simulada?</title><desc id="desc">La sesión pasa de null a una ficha y vuelve a null al salir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="800" height="594" rx="24" fill="#f8fafc"/>
<g font-family="DejaVu Sans,sans-serif" fill="#172554">
<text x="32" y="48" font-size="26" font-weight="700">¿Qué guarda una sesión simulada?</text>
<rect x="40" y="80" width="720" height="112" rx="16" fill="#eef2ff" stroke="#94a3b8"/>
<text x="62" y="111" font-size="22" font-weight="700">1. Arrancar</text>
<text x="62" y="142" font-size="18">usuarioActual = null</text>
<text x="62" y="169" font-size="18">activa = false · todavía no ha accedido nadie</text>
<path d="M400 197 V220" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="228" width="720" height="112" rx="16" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="259" font-size="22" font-weight="700">2. iniciarSesion(usuario)</text>
<text x="62" y="290" font-size="18">usuarioActual = ficha del repositorio</text>
<text x="62" y="317" font-size="18">activa = true · notifyListeners()</text>
<path d="M400 345 V368" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="376" width="720" height="112" rx="16" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="62" y="407" font-size="22" font-weight="700">3. cerrarSesion()</text>
<text x="62" y="438" font-size="18">usuarioActual = null</text>
<text x="62" y="465" font-size="18">activa = false · notifyListeners()</text>
<text x="32" y="570" font-size="17">Solo en memoria: reiniciar también devuelve la sesión a null.</text>
</g></svg>