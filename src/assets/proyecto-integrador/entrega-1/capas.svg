<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Responsabilidades y recorrido de los datos</title><desc id="desc">El servicio devuelve DTO al repositorio, que los convierte en modelos de dominio para la presentación. El dominio define los tipos compartidos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#285d58"/></marker></defs><rect width="960" height="430" rx="16" fill="#f6f9f8"/><g font-family="Arial, sans-serif" fill="#163b37"><text x="480" y="42" text-anchor="middle" font-size="28" font-weight="700">Del origen simulado a la pantalla</text><rect x="25" y="100" width="240" height="140" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="145.0" y="132" text-anchor="middle" font-size="23" font-weight="700">Servicio local</text><text x="145.0" y="165" text-anchor="middle" font-size="18" font-weight="400">Datos ficticios</text><text x="145.0" y="192" text-anchor="middle" font-size="18" font-weight="400">data/services</text><rect x="355" y="100" width="250" height="140" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="480.0" y="132" text-anchor="middle" font-size="23" font-weight="700">Repositorio</text><text x="480.0" y="165" text-anchor="middle" font-size="18" font-weight="400">Convierte y comprueba</text><text x="480.0" y="192" text-anchor="middle" font-size="18" font-weight="400">data/repositories</text><rect x="695" y="100" width="240" height="140" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="815.0" y="132" text-anchor="middle" font-size="23" font-weight="700">Presentación</text><text x="815.0" y="165" text-anchor="middle" font-size="18" font-weight="400">Pantallas y componentes</text><text x="815.0" y="192" text-anchor="middle" font-size="18" font-weight="400">ui</text><path d="M270 170 L348 170" fill="none" stroke="#285d58" stroke-width="3" marker-end="url(#arrow)"/><text x="309" y="148" text-anchor="middle" font-size="19" font-weight="700">DTO</text><path d="M610 170 L688 170" fill="none" stroke="#285d58" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="145" text-anchor="middle" font-size="18" font-weight="700">Modelos</text><rect x="175" y="295" width="610" height="100" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="480.0" y="327" text-anchor="middle" font-size="23" font-weight="700">Dominio</text><text x="480.0" y="360" text-anchor="middle" font-size="18" font-weight="400">domain/models · Tipos compartidos sin widgets ni DTO</text><text x="480" y="272" text-anchor="middle" font-size="18" font-weight="400">El repositorio y la presentación utilizan los modelos del dominio</text></g></svg>