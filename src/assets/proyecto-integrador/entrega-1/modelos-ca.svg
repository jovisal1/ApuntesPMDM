<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="title desc"><title id="title">Models relacionats d’una reserva</title><desc id="desc">Reserva relaciona Usuario i Espacio. Espacio conté ContactoLocal. Reserva conserva la tarifa i el preu total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#285d58"/></marker></defs><rect width="960" height="445" rx="16" fill="#f6f9f8"/><g font-family="Arial, sans-serif" fill="#163b37"><text x="480" y="42" text-anchor="middle" font-size="28" font-weight="700">Les relacions del domini</text><rect x="25" y="95" width="220" height="130" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="135.0" y="127" text-anchor="middle" font-size="23" font-weight="700">Usuario</text><text x="135.0" y="160" text-anchor="middle" font-size="18" font-weight="400">Qui reserva</text><text x="135.0" y="187" text-anchor="middle" font-size="18" font-weight="400">id · nom · correu</text><rect x="350" y="95" width="260" height="155" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="480.0" y="127" text-anchor="middle" font-size="23" font-weight="700">Reserva</text><text x="480.0" y="160" text-anchor="middle" font-size="18" font-weight="400">Activitat · horari</text><text x="480.0" y="187" text-anchor="middle" font-size="18" font-weight="400">Assistents · estat</text><text x="480.0" y="214" text-anchor="middle" font-size="18" font-weight="400">Tarifa, extres i total</text><rect x="715" y="95" width="220" height="130" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="825.0" y="127" text-anchor="middle" font-size="23" font-weight="700">Espacio</text><text x="825.0" y="160" text-anchor="middle" font-size="18" font-weight="400">Local que es reserva</text><text x="825.0" y="187" text-anchor="middle" font-size="18" font-weight="400">Aforament · preu per hora</text><path d="M350 160 L253 160" fill="none" stroke="#285d58" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="137" text-anchor="middle" font-size="17" font-weight="400">usuario</text><path d="M610 160 L707 160" fill="none" stroke="#285d58" stroke-width="3" marker-end="url(#arrow)"/><text x="660" y="137" text-anchor="middle" font-size="17" font-weight="400">espacio</text><rect x="655" y="315" width="280" height="100" rx="12" fill="#ffffff" stroke="#88aaa3" stroke-width="2"/><text x="795.0" y="347" text-anchor="middle" font-size="23" font-weight="700">ContactoLocal</text><text x="795.0" y="380" text-anchor="middle" font-size="18" font-weight="400">Responsable del local</text><path d="M825 232 L825 307" fill="none" stroke="#285d58" stroke-width="3" marker-end="url(#arrow)"/><text x="874" y="274" text-anchor="middle" font-size="17" font-weight="400">contacto</text><text x="310" y="331" text-anchor="middle" font-size="21" font-weight="700">L’usuari i el contacte del local</text><text x="310" y="361" text-anchor="middle" font-size="19" font-weight="400">representen persones amb funcions diferents.</text></g></svg>