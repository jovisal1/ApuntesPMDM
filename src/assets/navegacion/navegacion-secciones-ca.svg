<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Canviar de secció dins de la mateixa pantalla</title>
<desc id="desc">Dos estats de SeccionesPantalla: Catàleg seleccionat i Formulari seleccionat. Canvia el contingut central, es manté la barra i no s’apila una altra ruta.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#42648d" stroke-width="1.8"/></marker></defs>
<rect width="1100" height="460" rx="20" fill="#f1f5fb"/>
<g font-family="Arial, sans-serif" fill="#172c47">
<text x="26" y="37" font-size="23" font-weight="700">Una pantalla, diverses seccions</text>
<rect x="26" y="65" width="450" height="307" rx="15" fill="white" stroke="#b4c5db" stroke-width="2"/><text x="48" y="103" font-size="22" font-weight="700">Catàleg</text><path d="M26 123h450" stroke="#d7e1ee"/><rect x="46" y="145" width="410" height="132" rx="10" fill="#edf3ff"/><text x="251" y="204" font-size="18" font-weight="700" text-anchor="middle">Contingut del catàleg</text><text x="251" y="239" font-family="monospace" font-size="15" text-anchor="middle">body: _contenidos[0]</text><path d="M26 297h450" stroke="#d7e1ee"/><rect x="38" y="311" width="134" height="43" rx="21" fill="#245cca"/><text x="105" y="339" font-size="16" text-anchor="middle" fill="white">Catàleg</text><text x="251" y="339" font-size="16" text-anchor="middle" fill="#52667f">Formulari</text><text x="397" y="339" font-size="16" text-anchor="middle" fill="#52667f">Compte</text><rect x="624" y="65" width="450" height="307" rx="15" fill="white" stroke="#b4c5db" stroke-width="2"/><text x="646" y="103" font-size="22" font-weight="700">Formulari</text><path d="M624 123h450" stroke="#d7e1ee"/><rect x="644" y="145" width="410" height="132" rx="10" fill="#edf3ff"/><text x="849" y="204" font-size="18" font-weight="700" text-anchor="middle">Contingut del formulari</text><text x="849" y="239" font-family="monospace" font-size="15" text-anchor="middle">body: _contenidos[1]</text><path d="M624 297h450" stroke="#d7e1ee"/><text x="703" y="339" font-size="16" text-anchor="middle" fill="#52667f">Catàleg</text><rect x="782" y="311" width="134" height="43" rx="21" fill="#245cca"/><text x="849" y="339" font-size="16" text-anchor="middle" fill="white">Formulari</text><text x="995" y="339" font-size="16" text-anchor="middle" fill="#52667f">Compte</text><text x="550" y="181" font-size="14" text-anchor="middle">Prem</text><text x="550" y="204" font-size="14" text-anchor="middle">Formulari</text><path d="M492 227h116" fill="none" stroke="#42648d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="26" y="410" font-size="18">Es conserva el mateix Scaffold i la barra. Canvien el títol, el contingut i la selecció.</text>
<text x="26" y="440" font-size="18">En este exemple, canviar de secció no afig rutes a Navigator.</text>
</g></svg>