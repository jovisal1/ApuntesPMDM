<svg xmlns="http://www.w3.org/2000/svg" width="900" height="585" viewBox="0 0 900 585" role="img"><title>Cada pieza recibe solo lo que necesita</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="585" rx="20" fill="#f8fafc"/><g><text x="30" y="42" font-size="25" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Cada pieza recibe solo lo que necesita</text><rect x="250" y="70" width="400" height="80" rx="14" fill="white" stroke="#94a3b8"/><text x="268" y="100" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">main.dart</text><text x="268" y="127" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Crea repositorios, sesión y router</text><path d="M450 150 V172" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="150" y="175" width="600" height="80" rx="14" fill="#fff7ed" stroke="#94a3b8"/><text x="168" y="205" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">MultiProvider</text><text x="168" y="232" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">InscripcionesRepository · ArticulosRepository</text><path d="M450 255 V277" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="250" y="280" width="400" height="80" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="268" y="310" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">MaterialApp.router</text><text x="268" y="337" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">routerConfig: crearRouter(sesion)</text><path d="M380 360 V395 H225 V412" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M520 360 V395 H675 V412" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="415" width="395" height="110" rx="14" fill="#ecfdf5" stroke="#94a3b8"/><text x="48" y="445" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">/talleres</text><text x="48" y="472" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">context.read&lt;InscripcionesRepository&gt;()</text><text x="48" y="499" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">→ TalleresViewModel → TalleresPantalla</text><rect x="475" y="415" width="395" height="110" rx="14" fill="#ecfdf5" stroke="#94a3b8"/><text x="493" y="445" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">/prestamos</text><text x="493" y="472" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">context.read&lt;ArticulosRepository&gt;()</text><text x="493" y="499" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">→ EjemploDatosPantalla</text><text x="450" y="560" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle" font-family="DejaVu Sans,sans-serif">El router solo recibe la sesión; cada ruta pide su repositorio al árbol.</text></g></svg>