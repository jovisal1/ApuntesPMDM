<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
<title id="title">Panell modal des de baix</title><desc id="desc">La pantalla del formulari queda enfosquida mentre un panell inferior oferix triar entre Matí i Vesprada.</desc>
<rect width="800" height="370" rx="16" fill="#f1f5fb"/>
<g font-family="Arial, sans-serif" fill="#172c47">
<rect x="20" y="20" width="360" height="330" rx="15" fill="white" stroke="#b4c5db" stroke-width="2"/>
<text x="40" y="58" font-size="20" font-weight="700">Formulari d’inscripció</text><rect x="40" y="85" width="320" height="40" rx="6" fill="#edf3ff"/>
<rect x="20" y="20" width="360" height="330" rx="15" fill="#172c47" opacity="0.28"/>
<path d="M40 158h320q20 0 20 20v157q0 15-15 15H35q-15 0-15-15V178q0-20 20-20" fill="white"/>
<rect x="176" y="171" width="48" height="5" rx="3" fill="#a8b4c3"/>
<text x="40" y="207" font-size="21" font-weight="700">Tria un torn</text>
<rect x="40" y="226" width="320" height="45" rx="8" fill="#edf3ff"/><text x="58" y="255" font-size="18">Matí</text><rect x="40" y="284" width="320" height="45" rx="8" fill="#edf3ff"/><text x="58" y="313" font-size="18">Vesprada</text>
<text x="412" y="62" font-size="22" font-weight="700">showModalBottomSheet</text>
<text x="412" y="116" font-size="18">El panell apareix des de baix.</text>
<text x="412" y="160" font-size="18">El fons queda bloquejat</text><text x="412" y="187" font-size="18">mentre està obert.</text>
<text x="412" y="237" font-size="18">En triar, es tanca i retorna</text><text x="412" y="264" font-size="18">el resultat a la pantalla.</text>
<text x="412" y="320" font-size="16" fill="#52667f">No substituïx el formulari.</text>
</g></svg>