<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img"><title>Primer pas: una entrada nova en el catàleg</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="390" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif"><text x="30" y="42" font-size="25" font-weight="700" fill="#172554">Primer pas: una entrada nova en el catàleg</text><rect x="30" y="78" width="360" height="120" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="48" y="108" font-size="19" font-weight="700" fill="#172554">Catàleg · /</text><text x="48" y="137" font-size="17" font-weight="400" fill="#172554">Conservem els exemples anteriors</text><text x="48" y="162" font-size="17" font-weight="400" fill="#172554">+ entrada «Ajuda amb go_router»</text><path d="M400 138 H490" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="406" y="119" font-size="17" font-weight="400" fill="#172554">go</text><rect x="510" y="78" width="360" height="120" rx="14" fill="#ecfdf5" stroke="#94a3b8"/><text x="528" y="108" font-size="19" font-weight="700" fill="#172554">Ajuda · /ayuda</text><text x="528" y="137" font-size="17" font-weight="400" fill="#172554">Interruptor «Mostrar consells»</text><text x="528" y="162" font-size="17" font-weight="400" fill="#172554">Estat local d’esta pantalla</text><rect x="30" y="245" width="840" height="115" rx="14" fill="white" stroke="#94a3b8"/><text x="48" y="275" font-size="19" font-weight="700" fill="#172554">MaterialApp.router → GoRouter</text><text x="48" y="304" font-size="17" font-weight="400" fill="#172554">El mapa associa / i /ayuda amb les seues pantalles.</text><text x="48" y="329" font-size="17" font-weight="400" fill="#172554">Encara no afegim pestanyes ni protecció d’accés.</text></g></svg>