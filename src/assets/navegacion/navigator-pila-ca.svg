<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">La pila de rutes de Navigator</title><desc id="desc">push afig rutes damunt; pop retira la superior; popUntil permet tornar al catàleg retirant les rutes intermèdies.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#42648d" stroke-width="1.7"/></marker></defs>
<rect width="1100" height="530" rx="20" fill="#f1f5fb"/>
<g font-family="Arial, sans-serif" fill="#172c47">
<text x="26" y="38" font-size="24" font-weight="700">Navigator conserva un historial en forma de pila</text><text x="26" y="80" font-size="18" font-weight="700">1. Catàleg</text><rect x="26" y="104" width="226" height="250" rx="14" fill="white" stroke="#b4c5db" stroke-width="2"/><rect x="42" y="294" width="194" height="44" rx="7" fill="#245cca"/><text x="139" y="322" font-size="18" text-anchor="middle" fill="white">Catàleg</text><text x="277" y="199" font-size="14" text-anchor="middle">push</text><path d="M260 215h31" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="80" font-size="18" font-weight="700">2. Obrir Inicio</text><rect x="300" y="104" width="226" height="250" rx="14" fill="white" stroke="#b4c5db" stroke-width="2"/><rect x="316" y="294" width="194" height="44" rx="7" fill="#e4eaf3"/><text x="413" y="322" font-size="18" text-anchor="middle" fill="#52667f">Catàleg</text><rect x="316" y="228" width="194" height="44" rx="7" fill="#245cca"/><text x="413" y="256" font-size="18" text-anchor="middle" fill="white">Inicio</text><text x="551" y="199" font-size="14" text-anchor="middle">push</text><path d="M534 215h31" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/><text x="574" y="80" font-size="18" font-weight="700">3. Obrir Detalle</text><rect x="574" y="104" width="226" height="250" rx="14" fill="white" stroke="#b4c5db" stroke-width="2"/><rect x="590" y="294" width="194" height="44" rx="7" fill="#e4eaf3"/><text x="687" y="322" font-size="18" text-anchor="middle" fill="#52667f">Catàleg</text><rect x="590" y="228" width="194" height="44" rx="7" fill="#e4eaf3"/><text x="687" y="256" font-size="18" text-anchor="middle" fill="#52667f">Inicio</text><rect x="590" y="162" width="194" height="44" rx="7" fill="#245cca"/><text x="687" y="190" font-size="18" text-anchor="middle" fill="white">Detalle</text><text x="825" y="199" font-size="14" text-anchor="middle">pop</text><path d="M808 215h31" stroke="#42648d" stroke-width="2" marker-end="url(#arrow)"/><text x="848" y="80" font-size="18" font-weight="700">4. Tornar a Inicio</text><rect x="848" y="104" width="226" height="250" rx="14" fill="white" stroke="#b4c5db" stroke-width="2"/><rect x="864" y="294" width="194" height="44" rx="7" fill="#e4eaf3"/><text x="961" y="322" font-size="18" text-anchor="middle" fill="#52667f">Catàleg</text><rect x="864" y="228" width="194" height="44" rx="7" fill="#245cca"/><text x="961" y="256" font-size="18" text-anchor="middle" fill="white">Inicio</text><rect x="26" y="369" width="16" height="16" rx="3" fill="#245cca"/><text x="52" y="382" font-size="15">La ruta superior és la pantalla visible. Les anteriors es mantenen davall.</text>
<rect x="26" y="405" width="1048" height="100" rx="12" fill="white" stroke="#b4c5db"/>
<text x="46" y="435" font-size="18" font-weight="700">Tornar directament al catàleg des de Detalle</text>
<text x="46" y="464" font-family="monospace" font-size="17">popUntil((route) =&gt; route.isFirst)</text>
<text x="46" y="489" font-size="16">Retira Detalle i Inicio; conserva la ruta inicial del catàleg.</text>
</g></svg>