<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img"><title>go sustituye la pila; push apila encima</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="430" rx="20" fill="#f8fafc"/><g><text x="30" y="42" font-size="25" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">go sustituye la pila; push apila encima</text><text x="225" y="95" font-size="19" font-weight="700" fill="#172554" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">context.go('/ayuda')</text><text x="675" y="95" font-size="19" font-weight="700" fill="#172554" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">context.push('/ayuda')</text><rect x="100" y="240" width="250" height="52" rx="14" fill="#fff7ed" stroke="#94a3b8"/><text x="225" y="273" font-size="18" font-weight="700" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Ayuda</text><rect x="550" y="240" width="250" height="52" rx="14" fill="white" stroke="#94a3b8"/><text x="675" y="273" font-size="18" font-weight="700" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Catálogo</text><rect x="550" y="178" width="250" height="52" rx="14" fill="#fff7ed" stroke="#94a3b8"/><text x="675" y="211" font-size="18" font-weight="700" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Ayuda</text><text x="225" y="135" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">Pila: [Ayuda]</text><text x="675" y="135" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">Pila: [Catálogo, Ayuda]</text><text x="225" y="330" font-size="16" font-weight="400" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Ayuda queda sola: no hay flecha de volver.</text><text x="675" y="330" font-size="16" font-weight="400" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">El catálogo sigue debajo: hay flecha de volver.</text><path d="M810 205 C 860 225, 860 255, 810 265" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="450" y="385" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">pop('Consejo leído') → el catálogo recibe el texto</text></g></svg>