<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img"><title>Dos pestañas, dos historiales</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="470" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif"><text x="30" y="42" font-size="25" font-weight="700" fill="#172554">Dos pestañas, dos historiales</text><text x="30" y="79" font-size="20" font-weight="700" fill="#172554">StatefulShellRoute.indexedStack</text><rect x="30" y="105" width="395" height="130" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="48" y="135" font-size="19" font-weight="700" fill="#172554">Rama 0 · Talleres</text><text x="48" y="164" font-size="17" font-weight="400" fill="#172554">/talleres</text><text x="48" y="189" font-size="17" font-weight="400" fill="#172554">Listado → detalle /talleres/20</text><rect x="475" y="105" width="395" height="130" rx="14" fill="#ecfdf5" stroke="#94a3b8"/><text x="493" y="135" font-size="19" font-weight="700" fill="#172554">Rama 1 · Ayuda</text><text x="493" y="164" font-size="17" font-weight="400" fill="#172554">/ayuda</text><text x="493" y="189" font-size="17" font-weight="400" fill="#172554">Interruptor activado o desactivado</text><path d="M225 250 V295" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M675 250 V295" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="310" width="840" height="125" rx="14" fill="white" stroke="#94a3b8"/><text x="48" y="340" font-size="19" font-weight="700" fill="#172554">Barra inferior común: Talleres | Ayuda</text><text x="48" y="369" font-size="17" font-weight="400" fill="#172554">Cambiar de pestaña recupera su pantalla y estado anterior.</text><text x="48" y="394" font-size="17" font-weight="400" fill="#172554">Pulsar la pestaña ya activa vuelve a la