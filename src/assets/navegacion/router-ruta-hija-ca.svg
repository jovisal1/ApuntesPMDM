<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img"><title>Una ruta filla construeix la pila amb el seu pare</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="500" rx="20" fill="#f8fafc"/><g><text x="30" y="42" font-size="25" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Una ruta filla construeix la pila amb el seu pare</text><rect x="30" y="75" width="380" height="150" rx="14" fill="white" stroke="#94a3b8"/><text x="48" y="105" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Mapa de rutes</text><text x="60" y="145" font-size="18" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">/talleres</text><text x="90" y="185" font-size="17" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">└ :id   (filla → /talleres/:id)</text><text x="655" y="110" font-size="19" font-weight="700" fill="#172554" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">go('/talleres/20?q=cer')</text><path d="M655 125 V160" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="480" y="250" width="350" height="80" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="498" y="280" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Tallers</text><text x="498" y="307" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">q=cer → llistat filtrat</text><rect x="480" y="165" width="350" height="80" rx="14" fill="#fff7ed" stroke="#94a3b8"/><text x="498" y="195" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Detall 20</text><text x="498" y="222" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">id=20 → Ceràmica</text><text x="655" y="355" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle" font-family="DejaVu Sans Mono,monospace">Pila: [Tallers, Detall 20]</text><text x="450" y="420" font-size="17" font-weight="400" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Les dues pàgines reben la mateixa ubicació.</text><text x="450" y="450" font-size="17" font-weight="400" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Tornar (pop) mostra el llistat encara filtrat.</text></g></svg>