<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1090" viewBox="0 0 960 1090" role="img"><title>Accés a Compte segons la sessió</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="960" height="1090" rx="24" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif"><text x="36" y="46" font-size="28" font-weight="700" fill="#172554">Com accedim a Compte?</text><rect x="240" y="80" width="480" height="90" rx="16" fill="#eef2ff" stroke="#cbd5e1"/><text x="262" y="113" font-size="20" font-weight="700" fill="#172554">1. Sol·licitar /cuenta</text><text x="262" y="143" font-size="17" font-weight="400" fill="#172554">Des del catàleg o mitjançant una URL</text><path d="M480 180 V220" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="300" y="235" width="360" height="90" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="322" y="268" font-size="20" font-weight="700" fill="#172554">2. Hi ha sessió activa?</text><text x="322" y="298" font-size="17" font-weight="400" fill="#172554">redirect → SesionViewModel</text><path d="M300 280 H130 V955 H230" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="79" y="322" font-size="19" font-weight="700" fill="#172554">SÍ</text><text x="150" y="365" font-size="16" font-weight="400" fill="#172554">Accés</text><text x="150" y="389" font-size="16" fill="#172554">directe</text><path d="M480 335 V385" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="500" y="363" font-size="19" font-weight="700" fill="#172554">NO</text><rect x="280" y="400" width="440" height="110" rx="16" fill="#fff7ed" stroke="#cbd5e1"/><text x="302" y="433" font-size="20" font-weight="700" fill="#172554">3. Mostrar Login</text><text x="302" y="463" font-size="17" font-weight="400" fill="#172554">/login?from=%2Fcuenta</text><text x="302" y="488" font-size="17" font-weight="400" fill="#172554">from conserva la destinació /cuenta</text><path d="M500 520 V560" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="280" y="575" width="440" height="115" rx="16" fill="#eef2ff" stroke="#cbd5e1"/><text x="302" y="608" font-size="20" font-weight="700" fill="#172554">4. Comprovar les dades</text><text x="302" y="638" font-size="17" font-weight="400" fill="#172554">Vista → ViewModel → repository</text><text x="302" y="663" font-size="17" font-weight="400" fill="#172554">Consulta els usuaris ficticis</text><path d="M730 633 H860 V456 H730" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="750" y="554" font-size="18" font-weight="700" fill="#172554">Error</text><text x="746" y="579" font-size="15" font-weight="400" fill="#172554">Seguix en Login</text><path d="M500 700 V740" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><text x="520" y="725" font-size="17" font-weight="400" fill="#172554">Dades correctes</text><rect x="280" y="755" width="440" height="90" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="302" y="788" font-size="20" font-weight="700" fill="#172554">5. Activar la sessió</text><text x="302" y="818" font-size="17" font-weight="400" fill="#172554">Guarda DatosAcceso i notifica el router</text><path d="M500 855 V895" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="240" y="910" width="480" height="90" rx="16" fill="#ecfdf5" stroke="#cbd5e1"/><text x="262" y="943" font-size="20" font-weight="700" fill="#172554">6. Mostrar Compte · /cuenta</text><text x="262" y="973" font-size="17" font-weight="400" fill="#172554">Salutació i dades completes de l’usuari</text><text x="36" y="1040" font-size="18" font-weight="700" fill="#172554">Tancar sessió esborra DatosAcceso: /cuenta torna a portar a Login.</text></g></svg>