<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img"><title>Així quedarà la navegació del catàleg</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="610" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif"><text x="30" y="42" font-size="25" font-weight="700" fill="#172554">Així quedarà la navegació del catàleg</text><rect x="230" y="75" width="440" height="95" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="248" y="105" font-size="19" font-weight="700" fill="#172554">Catàleg de components · /</text><text x="248" y="134" font-size="17" font-weight="400" fill="#172554">Exemples anteriors + dos entrades noves</text><path d="M330 180 V211 H225 V244" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M570 180 V211 H675 V244" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="260" width="395" height="110" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="48" y="290" font-size="19" font-weight="700" fill="#172554">Tallers amb go_router</text><text x="48" y="319" font-size="17" font-weight="400" fill="#172554">/talleres → /talleres/:id</text><text x="48" y="344" font-size="17" font-weight="400" fill="#172554">Llistat, filtre i detall</text><rect x="475" y="260" width="395" height="110" rx="14" fill="#fff7ed" stroke="#94a3b8"/><text x="493" y="290" font-size="19" font-weight="700" fill="#172554">El meu compte (accés simulat)</text><text x="493" y="319" font-size="17" font-weight="400" fill="#172554">/cuenta</text><text x="493" y="344" font-size="17" font-weight="400" fill="#172554">Sense sessió → Login → Compte</text><path d="M225 380 V420" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="435" width="395" height="110" rx="14" fill="#ecfdf5" stroke="#94a3b8"/><text x="48" y="465" font-size="19" font-weight="700" fill="#172554">Barra inferior: Tallers | Ajuda</text><text x="48" y="494" font-size="17" font-weight="400" fill="#172554">/talleres ↔ /ayuda</text><text x="48" y="519" font-size="17" font-weight="400" fill="#172554">Conserva cada branca en alternar</text><rect x="475" y="435" width="395" height="110" rx="14" fill="white" stroke="#94a3b8"/><text x="493" y="465" font-size="19" font-weight="700" fill="#172554">Fora de la barra inferior</text><text x="493" y="494" font-size="17" font-weight="400" fill="#172554">Catàleg, Login i Compte</text><text x="493" y="519" font-size="17" font-weight="400" fill="#172554">La protecció només afecta Compte</text></g></svg>