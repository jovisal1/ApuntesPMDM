<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img"><title>Així quedarà la navegació del catàleg</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="640" rx="20" fill="#f8fafc"/><g><text x="30" y="42" font-size="25" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Així quedarà la navegació del catàleg</text><rect x="230" y="70" width="440" height="90" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="248" y="100" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Catàleg · /</text><text x="248" y="127" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Exemples anteriors + tres entrades noves</text><path d="M330 170 V215" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M570 170 V215" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="215" width="395" height="250" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/><text x="48" y="245" font-size="16" font-weight="700" fill="#64748b" text-anchor="start" font-family="DejaVu Sans,sans-serif">Filles de / (fora de la barra)</text><rect x="48" y="262" width="360" height="85" rx="14" fill="white" stroke="#94a3b8"/><text x="66" y="292" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Login · /login</text><text x="66" y="319" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Formulari reutilitzat</text><rect x="48" y="370" width="360" height="85" rx="14" fill="#fff7ed" stroke="#94a3b8"/><text x="66" y="400" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">El meu compte · /cuenta</text><text x="66" y="427" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Protegit: sense sessió → Login</text><rect x="475" y="215" width="395" height="330" rx="14" fill="#ecfdf5" stroke="#94a3b8" stroke-dasharray="6 5"/><text x="493" y="245" font-size="16" font-weight="700" fill="#64748b" text-anchor="start" font-family="DejaVu Sans,sans-serif">Shell: barra inferior Tallers | Ajuda</text><rect x="493" y="262" width="360" height="115" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="511" y="292" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Branca 0 · Tallers</text><text x="511" y="319" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">/talleres?q=…</text><text x="511" y="346" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">→ /talleres/:id (detall)</text><rect x="493" y="395" width="360" height="115" rx="14" fill="#eef2ff" stroke="#94a3b8"/><text x="511" y="425" font-size="19" font-weight="700" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Branca 1 · Ajuda</text><text x="511" y="452" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans Mono,monospace">/ayuda</text><text x="511" y="479" font-size="16" font-weight="400" fill="#172554" text-anchor="start" font-family="DejaVu Sans,sans-serif">Interruptor amb estat</text><text x="450" y="600" font-size="17" font-weight="400" fill="#172554" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Cada branca conserva la seua pila i el seu estat en canviar de pestanya.</text></g></svg>